name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bernice-hairplace-api

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -q

  openapi-diff:
    name: OpenAPI breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare against the base branch
        run: |
          git show "origin/${{ github.base_ref }}:openapi.json" > base-openapi.json 2>/dev/null || {
            echo "No openapi.json on the base branch yet; skipping"; exit 0; }
          docker run --rm -v "$PWD:/w" -w /w tufin/oasdiff:stable \
            breaking base-openapi.json openapi.json --fail-on ERR

  migrations-sync:
    name: Migrations match the web repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the web repo
        id: web
        env:
          TOKEN: ${{ secrets.WEB_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::WEB_REPO_TOKEN not set; skipping migration sync check"; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/timothymayor/bernice_hairplace_web.git" web
          echo "cloned=true" >> "$GITHUB_OUTPUT"
      - name: Files present in both repos must be identical (ADR 0001)
        if: steps.web.outputs.cloned == 'true'
        run: |
          status=0
          for f in supabase/migrations/*.sql; do
            other="web/$f"
            if [ -f "$other" ] && ! cmp -s "$f" "$other"; then
              echo "::error file=$f::differs from the web repo"; status=1
            fi
          done
          exit $status

  smoke:
    name: Image build, scan and readiness
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Today's date (refreshes the OS security-update layer daily)
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: SECURITY_REFRESH=${{ steps.date.outputs.today }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        # Findings become annotations (visible in the PR and the checks API) and a job summary.
        run: |
          python3 - <<'PY'
          import json, os, sys
          report = json.load(open("trivy.json"))
          vulns = [
              (r.get("Target", ""), v)
              for r in report.get("Results") or []
              for v in r.get("Vulnerabilities") or []
          ]
          lines = ["| Severity | Package | Installed | Fixed | ID | Target |", "|---|---|---|---|---|---|"]
          for target, v in vulns:
              lines.append(
                  f"| {v['Severity']} | {v['PkgName']} | {v.get('InstalledVersion', '')} "
                  f"| {v.get('FixedVersion', '')} | {v['VulnerabilityID']} | {target} |"
              )
          for target, v in vulns[:10]:
              print(
                  f"::error title=Trivy {v['VulnerabilityID']}::{v['Severity']} {v['PkgName']} "
                  f"{v.get('InstalledVersion', '')} -> {v.get('FixedVersion', '')} ({target})"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Trivy: {len(vulns)} fixable HIGH/CRITICAL\n\n")
              if vulns:
                  summary.write("\n".join(lines) + "\n")
          sys.exit(1 if vulns else 0)
          PY
      - name: Run the API (read-only root fs, as in production)
        run: |
          docker run -d --name api --network host --read-only --tmpfs /tmp \
            -e APP_ENV=test \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            "$IMAGE:${{ github.sha }}"
      - name: /healthz and /readyz are green
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz | tee readyz.json
          grep -q '"status":"ready"' readyz.json
      - name: Worker starts
        run: |
          docker run -d --name worker --network host --read-only --tmpfs /tmp \
            -e APP_ENV=test -e REDIS_URL=redis://127.0.0.1:6379/0 \
            "$IMAGE:${{ github.sha }}" arq app.workers.settings.WorkerSettings
          sleep 8
          docker logs worker 2>&1 | grep -q worker.heartbeat
      - name: Logs on failure
        if: failure()
        run: docker logs api || true; docker logs worker || true
      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${GITHUB_REF_NAME}"
            docker push "$IMAGE:${GITHUB_REF_NAME}"
          fi
