[project]
name = "bernice-hairplace-api"
version = "1.0.0"
description = "Bernice Hairplace API: catalog, cart, checkout and Paystack payments for the web store and mobile app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "redis>=5.2,<7",
    "arq>=0.26",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.19",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.21",
    "jinja2>=3.1.4",
    "uvicorn-worker>=0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "hypothesis>=6.120",
    "fakeredis[lua]>=2.26",
    "asgi-lifespan>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "BLE001"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["arq.*", "fakeredis.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a real Postgres (TEST_DATABASE_URL)"]
addopts = "-m 'not integration'"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
